name: CI/CD Pipeline - React Pokedex

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura o Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Faz login no Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Compila a imagem e faz push para o Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/react_pokedex:latest

      # 5. Conecta na VM via SSH e atualiza o container
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Baixa a nova imagem do Docker Hub
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/react_pokedex:latest

            # Remove o container antigo (se existir)
            docker stop react-pokedex || true
            docker rm react-pokedex || true

            # Sobe o novo container conectado na rede lab-net (Sem expor portas externas)
            docker run -d \
              --name react-pokedex \
              --net lab-net \
              --restart always \
              ${{ secrets.DOCKERHUB_USERNAME }}/react_pokedex:latest